# Workflow reutilizable (DEVOPS-28): plan, apply o destroy de UN ambiente.
# Lo llama terraform.yml una vez por ambiente (dev, test, prod). La lógica está
# en scripts/terraform-ambiente.sh, que también se puede correr en CloudShell.
#
# Dos jobs y corre solo uno de los dos:
#   plan    -> sin "environment": no pide aprobación (planes de los PRs).
#   aplicar -> apply o destroy, con "environment" de GitHub. En "production"
#              hay required reviewers: el job queda en pausa hasta que alguien
#              lo aprueba en la pestaña Actions. El plan que se aprueba es el
#              que se vio en el PR a main (job plan de ese PR).

name: Terraform (ambiente)

on:
  workflow_call:
    inputs:
      ambiente:
        description: "dev, test o prod"
        type: string
        required: true
      accion:
        description: "plan, apply o destroy"
        type: string
        required: true
      github_environment:
        description: "Environment de GitHub para apply/destroy (dev, test o production)"
        type: string
        required: true
      image_tag:
        description: "SHA de tero-app (vacío = automático)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TF_VERSION: 1.17.2

jobs:
  plan:
    name: plan ${{ inputs.ambiente }}
    if: inputs.accion == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: terraform-${{ inputs.ambiente }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Terraform (versión fija y checksum verificado)
        run: ./scripts/ci/instalar-terraform.sh

      - name: Credenciales de AWS (AWS Academy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Academy da credenciales temporales: sin el session token no autentican.
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: terraform plan (${{ inputs.ambiente }})
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          ADMIN_ALLOWED_CIDRS: ${{ secrets.ADMIN_ALLOWED_CIDRS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: ./scripts/terraform-ambiente.sh "${{ inputs.ambiente }}" plan

  aplicar:
    name: ${{ inputs.accion }} ${{ inputs.ambiente }}
    if: inputs.accion == 'apply' || inputs.accion == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Aprobación manual: se configura en Settings → Environments (production).
    environment:
      name: ${{ inputs.github_environment }}
    # Un solo plan/apply a la vez por ambiente (además del lock del state en S3).
    concurrency:
      group: terraform-${{ inputs.ambiente }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Terraform (versión fija y checksum verificado)
        run: ./scripts/ci/instalar-terraform.sh

      - name: Credenciales de AWS (AWS Academy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: terraform ${{ inputs.accion }} (${{ inputs.ambiente }})
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          ADMIN_ALLOWED_CIDRS: ${{ secrets.ADMIN_ALLOWED_CIDRS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: ./scripts/terraform-ambiente.sh "${{ inputs.ambiente }}" "${{ inputs.accion }}"
